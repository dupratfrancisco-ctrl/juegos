<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TEG</title>
<meta name="description" content="TEG, el juego de la guerra: de 2 a 6 jugadores, con objetivos secretos. Online con código, contra la IA o en el mismo celular.">
<meta name="theme-color" content="#14202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TEG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/logo-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IM+Fell+English+SC&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* Pantalla fija: sin zoom por doble toque ni por pellizco (el mapa tiene su propio zoom) */
/* La página solo se mueve para arriba y abajo: de costado queda fija */
html,body{touch-action:pan-y;overscroll-behavior:none}
html{overflow-x:hidden}body{overflow-x:clip;max-width:100vw}
button,a,input,[role=button]{touch-action:manipulation}
input,textarea{font-size:max(16px,1em)}
[hidden]{display:none!important}
/* Layout: war-room look — dark navy ocean, slate panels, khaki-gold stencil accents, the world map as a pannable SVG with army counters. */
:root{
  --sea:#14202b; --sea-2:#1b2c3b; --panel:#22313f; --panel-2:#1a2733; --line:#3a5068;
  --gold:#e0b04a; --gold-ink:#2a1d00; --red:#e04b3c; --ok:#7ee08a; --bad:#ff8a80;
  --fg:#f3efe4; --muted:#a8b6c4;
  --f-display:"Black Ops One","Arial Black",sans-serif;
  --f-head:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);background-image:radial-gradient(80% 40% at 50% 0%,#24394d 0%,transparent 70%);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
#app{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 90px;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--gold);color:var(--gold-ink);font-family:var(--f-head);font-weight:700;font-size:1.08rem;letter-spacing:.05em;text-transform:uppercase;padding:11px 14px;min-height:46px;box-shadow:0 3px 0 #8a6a22}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8a6a22}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 3px 0 #7d1a1a}
.btn.small{font-size:.9rem;min-height:38px;padding:7px 11px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:11px 13px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--fg)}
input[type=text]::placeholder{color:#6f8296}
.label{font-family:var(--f-head);font-weight:600;font-size:.85rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.center{text-align:center}
.mast{display:flex;align-items:center;gap:12px;padding-top:4px}
.mast .logo{width:76px;height:76px;border-radius:50%;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.brand{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;color:var(--gold);font-size:clamp(2.6rem,13vw,3.6rem);line-height:1;letter-spacing:.04em;text-shadow:0 3px 0 #000}
.panel{background:var(--panel);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 40px;background:var(--panel-2);font-family:var(--f-head);font-weight:700;font-size:1.05rem;padding:9px 0;box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--sea);box-shadow:none}
.ask{display:flex;gap:8px}.ask input{flex:1;min-width:0}.ask .btn{flex:0 0 auto}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-weight:600}
.netst{font-size:.9rem;font-weight:600;color:var(--muted)}.netst.ok{color:var(--ok)}.netst.fail{color:var(--bad)}
.linkbtn{background:none;text-decoration:underline;font-weight:700;padding:0 4px}
.code{font-family:var(--f-display);font-size:clamp(3rem,16vw,4.3rem);letter-spacing:.14em;line-height:1;text-align:center;padding:8px 0;border-block:2px dashed var(--line)}
details summary{font-family:var(--f-head);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:65ch}

/* Jugadores */
.players{display:flex;gap:5px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:5px;white-space:nowrap;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 9px 3px 4px;font-size:.82rem}
.pl.turn{box-shadow:inset 0 0 0 2px var(--gold);font-weight:700}
.pl.out{opacity:.45;text-decoration:line-through}
.pl .st{color:var(--muted);font-size:.8rem}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}

/* Estado y acciones */
.status{border-radius:12px;padding:10px 12px;background:var(--panel-2);display:flex;flex-direction:column;gap:7px;min-height:7.6rem;box-shadow:inset 0 0 0 1px var(--line)}
.status.me{box-shadow:inset 0 0 0 2px var(--gold)}
.status h2{font-family:var(--f-head);font-weight:700;font-size:1.22rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status h2 .rd{margin-left:auto;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.status p{font-size:.95rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1 1 110px}
.status h2 b{color:var(--gold);font-size:1.45rem;line-height:1}
.stp{display:flex;align-items:center;gap:8px}.stp .seg{flex:1}
.stp .seg button{padding:5px 0;font-size:.95rem}
.dice{display:flex;flex-direction:column;gap:6px;font-size:.9rem;min-height:6.3rem;justify-content:center}
.dice.empty{min-height:0}
.dice .dr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dice .ds{display:flex;gap:7px}
.dice .vs{color:var(--muted);font-weight:700;font-family:var(--f-head)}
.d{position:relative;display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:38px;height:38px;padding:6px;border-radius:9px;background:var(--dc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.35)}
.d i{width:7px;height:7px;border-radius:50%;place-self:center}
.d i.on{background:var(--di);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.d.lost{opacity:.45}
.d.q{display:grid;grid-template:none;place-items:center;font-family:var(--f-head);font-weight:700;font-size:1.3rem;color:var(--di)}
#rollb{flex:1 1 100%;font-size:1.25rem;min-height:54px}
.d.lost::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;background:#ff5a4a;transform:rotate(-35deg);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.dice.rolling .d{animation:tumble .3s linear infinite}
.dice.fresh .d{animation:land .55s cubic-bezier(.2,.8,.3,1.2) both}
.dice.fresh .ds .d:nth-child(2){animation-delay:.06s}.dice.fresh .ds .d:nth-child(3){animation-delay:.12s}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-5px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-5px)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes land{0%{transform:scale(.3) rotate(-200deg);opacity:0}70%{transform:scale(1.12) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.ct.aim .hl{fill:#ff3b2b;fill-opacity:.65}.ct.aim .ring{stroke:#ffd75a;stroke-width:2.4}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);font-size:.9rem;padding:7px 10px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--sea);box-shadow:none}

/* Mapa */
.mapwrap{-webkit-tap-highlight-color:transparent;position:relative;width:100%;height:min(64vh,560px);min-height:300px;border-radius:12px;overflow:hidden;background:#3b2614;box-shadow:inset 0 0 0 2px var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mapwrap *{touch-action:none}
.mapwrap svg{display:block;width:100%;height:100%}
.mapwrap .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapwrap .zoom button{width:36px;height:36px;border-radius:10px;background:rgba(20,32,43,.85);color:var(--fg);font-size:1.3rem;font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.mapwrap .zoom button.all{font-size:.7rem;font-family:var(--f-head);letter-spacing:.04em}
.mapwrap .hint{position:absolute;left:8px;bottom:8px;font-size:.75rem;color:var(--muted);background:rgba(20,32,43,.75);padding:3px 8px;border-radius:999px;pointer-events:none}
.ct{cursor:pointer}
.ct .hl{fill:var(--oc);fill-opacity:.12;stroke:none}
.ct .ring{fill:none;stroke:none;pointer-events:none}
.ct.can .hl{fill:#fff;fill-opacity:.3}
.ct.sel .hl{fill:#ffd75a;fill-opacity:.5}.ct.sel .ring{stroke:#ffd75a;stroke-width:2.2}
.ct.tgt .hl{fill:#ff3b2b;fill-opacity:.55;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{fill-opacity:.3}to{fill-opacity:.7}}.ct.tgt .ring{stroke:#ff5a4a;stroke-width:1.6;stroke-dasharray:3 2}
.ct.mov .hl{fill:#7ee08a;fill-opacity:.5}.ct.mov .ring{stroke:#7ee08a;stroke-width:1.6;stroke-dasharray:3 2}
.ct .nm{font-family:"IM Fell English SC",Georgia,serif;font-size:8px;fill:#2b1a0a;paint-order:stroke;stroke:rgba(250,240,215,.85);stroke-width:1.8px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.ct .ar{font-family:var(--f-head);font-weight:700;font-size:9.5px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rt1{stroke:#2a1a0c;stroke-width:2.2;stroke-linecap:round}.rt2{stroke:#f5ecd6;stroke-width:1.1;stroke-dasharray:3 3}
.sea{font-family:"IM Fell English SC",Georgia,serif;font-size:17px;fill:#2b1a0a;opacity:.8;text-anchor:middle;letter-spacing:1px}
.to{font-family:"IM Fell English SC",Georgia,serif;font-size:6.5px;fill:#2b1a0a}
.flash{animation:fl 1s ease-out}
@keyframes fl{0%{stroke:#fff;stroke-width:12}100%{stroke-width:0}}

/* Tarjetas y objetivo */
.cards{display:flex;gap:6px;flex-wrap:wrap}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:92px;background:#efe7d3;color:#2a2418;border-radius:9px;padding:6px 9px;box-shadow:0 2px 0 #b9ad90;text-align:left;font-size:.88rem;font-weight:600}
.tcard .sy{font-size:1.15rem;line-height:1}
.tcard small{font-size:.72rem;font-weight:500;color:#6b5f45}
.tcard[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:1px}
.tcard.used{opacity:.6}
.obj{font-size:1rem;font-weight:600;background:rgba(224,176,74,.12);border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem;max-height:220px;overflow-y:auto}
.log li{display:flex;gap:6px;align-items:baseline;background:rgba(0,0,0,.18);border-radius:8px;padding:5px 8px}
.log li .dot{width:11px;height:11px;transform:translateY(1px)}
.verdict{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;text-align:center;color:var(--gold)}
.cover{min-height:55vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.cover .who{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,11vw,3.2rem)}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seats li{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px}
.seats li .n{flex:1;font-weight:600}
.objs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.objs li{display:flex;gap:8px;align-items:flex-start;background:rgba(0,0,0,.2);border-radius:8px;padding:7px 9px}
.objs li .dot{margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#0b1117;color:var(--fg);box-shadow:0 0 0 2px var(--gold);padding:12px 16px;border-radius:12px;max-width:min(520px,calc(100vw - 32px));font-size:.95rem}
/* Chat */
.chatbtn{position:fixed;z-index:22;right:max(14px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font-family:var(--f-head);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.chatbtn .cbadge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.8rem;display:grid;place-items:center;letter-spacing:0}
.chat{position:fixed;z-index:30;left:0;right:0;bottom:0;max-height:70vh;max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:10px;background:var(--panel-2);box-shadow:0 -10px 30px rgba(0,0,0,.55);border-radius:18px 18px 0 0;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.chat>*{width:100%;min-width:0}
.chathead{display:flex;align-items:baseline;gap:10px}.chathead b{font-family:var(--f-head);font-size:1.3rem}.chathead .linkbtn{margin-left:auto}
.chatlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:120px;flex:1}
.chatlog li{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.chatlog li small{font-size:.75rem;color:var(--muted);padding-left:6px}
.chatlog li span{max-width:80%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--line);overflow-wrap:anywhere}
.chatlog li.mine{align-items:flex-end}.chatlog li.mine span{background:var(--gold);color:var(--gold-ink);border-radius:14px 14px 4px 14px}
.chatlog li.none{color:var(--muted);font-size:.92rem}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .chip{font-size:.88rem}
@media (max-height:520px) and (orientation:landscape){.chat{max-height:85vh}}
/* Celular acostado: el mapa a la izquierda con todo el alto, los controles a la derecha */
@media (orientation:landscape) and (max-height:560px) and (min-width:560px){
  #app:is([data-sc="play"],[data-sc="over"]){max-width:none;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);align-items:start;column-gap:10px;padding-block:6px 80px}
  #app:is([data-sc="play"],[data-sc="over"])>.mapcol{grid-column:1;grid-row:1 / span 8;position:sticky;top:6px}
  #app:is([data-sc="play"],[data-sc="over"])>*:not(.mapcol){grid-column:2}
  .mapwrap{height:calc(100dvh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0}
  .status{min-height:0}
  .mapwrap .hint{display:none}
}
@media (min-width:900px) and (min-height:561px){
  /* Solo la partida (y el final, con el mapa) va en dos columnas; la sala y el inicio quedan centrados */
  /* El mapa ocupa todo el alto de la pantalla a la izquierda; jugadores y controles van a la derecha */
  #app:is([data-sc="play"],[data-sc="over"]){max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);align-items:start;column-gap:14px;padding-block:10px 40px}
  #app:is([data-sc="play"],[data-sc="over"])>.mapcol{grid-column:1;grid-row:1 / span 9;position:sticky;top:10px}
  #app:is([data-sc="play"],[data-sc="over"])>*:not(.mapcol){grid-column:2}
  #app:is([data-sc="play"],[data-sc="over"])>#leave{grid-column:2}
  .mapwrap{height:calc(100dvh - 20px);max-height:calc((100vw - 370px)*.714);min-height:420px;aspect-ratio:auto}
}
/* Compu y pantallas anchas: la pantalla de inicio en columnas */
@media (min-width:980px) and (min-height:561px){
  #app[data-sc="home"]{max-width:1240px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start;gap:16px}
  #app[data-sc="home"]>.mast,#app[data-sc="home"]>details,#app[data-sc="home"]>.rules{grid-column:1/-1}
}
.seats li{flex-wrap:wrap}
.blv{display:inline-flex;gap:3px}
.blv button{font-family:var(--f-head);font-weight:700;font-size:.8rem;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.blv button[aria-pressed=true]{background:#fff;color:#1d2430;box-shadow:none}
/* Sala de espera, pasar el celular y avisos: una columna centrada, igual en todos los juegos */
#app:is([data-sc="lobby"],[data-sc="full"],[data-sc="handoff"],[data-sc="loading"],[data-sc="cover"]){max-width:640px;margin-inline:auto}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<button id="chatbtn" class="chatbtn" type="button" aria-label="Abrir el chat" hidden>Chat<span id="chatbadge" class="cbadge" hidden></span></button>
<section id="chat" class="chat" role="dialog" aria-label="Chat de la partida" hidden>
  <div class="chathead"><b>Chat</b><button type="button" class="linkbtn" id="chatclose">Cerrar</button></div>
  <ol id="chatlog" class="chatlog"></ol>
  <div class="quick"></div>
  <form id="chatform" class="ask" autocomplete="off"><input type="text" id="chatin" maxlength="200" placeholder="Escribí un mensaje" enterkeyhint="send"><button class="btn small" type="submit">Enviar</button></form>
</section>
<div id="toast" class="toast" role="status" hidden></div>
<script src="mqtt.min.js"></script>
<script src="engine.js"></script>
<script src="map.js"></script>
<script>
// Safari ignora user-scalable=no: el pellizco de la página se bloquea a mano.
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const E = Teg;
/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rid = () => Math.random().toString(36).slice(2,10);
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem("teg:"+k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem("teg:"+k, JSON.stringify(v)); } catch {} },
};
let toastT;
function toast(msg, ms=3800){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms); }
function buzz(p=[60,40,60]){ try { navigator.vibrate && navigator.vibrate(p); } catch {} }
const SYM = {"globo":"🎈", "cañón":"💣", "barco":"⛵", "comodín":"🃏"};
const NAME = id => E.BYID[id]?.name || (id.startsWith("comodin") ? "Comodín" : id);
const colorOf = i => E.COLORS[i].hex;
const inkOf = i => i===2 ? "#2a2200" : "#fff";

/* ===== Red =====
   Las partidas viajan por un servidor MQTT público (sin cuentas). Cada partida es un tema con el
   último estado retenido. Toda la partida viaja junta: la pantalla solo muestra tu objetivo y tus tarjetas. */
const qs = new URLSearchParams(location.search);
const BROKERS = qs.get("broker") ? [qs.get("broker")] : [
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://broker.emqx.io:8084/mqtt",
  "wss://test.mosquitto.org:8081/mqtt",
  "wss://mqtt.eclipseprojects.io:443/mqtt",
];
const TOPIC = code => "fd-teg/v1/" + code;
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
function merge(base, patch){
  const out = isObj(base) ? {...base} : {};
  for (const k in patch) out[k] = isObj(patch[k]) && isObj(out[k]) ? merge(out[k], patch[k]) : patch[k];
  return out;
}
const Net = {
  client:null, games:{}, waiters:{}, subs:new Set(),
  tryBroker(url){
    return new Promise((res, rej) => {
      const c = mqtt.connect(url, {clientId:"tg_"+rid()+rid(), clean:true, keepalive:30, reconnectPeriod:0, connectTimeout:7000});
      const fail = () => { clearTimeout(t); try { c.end(true); } catch {} rej(); };
      const t = setTimeout(fail, 8000);
      c.once("connect", () => { clearTimeout(t); res(c); });
      c.once("error", fail);
    });
  },
  connect(){ return this._p || (this._p = this._connect().finally(() => { this._p = null; })); },
  async _connect(){
    if (this.client?.connected) return;
    if (this.client){ try { this.client.end(true); } catch {} this.client=null; }
    for (const url of BROKERS){
      try { this.client = await this.tryBroker(url); break; } catch {}
    }
    if (!this.client) throw new Error("net");
    const c = this.client;
    c.options.reconnectPeriod = 2000;
    let wasOff = false;
    c.on("offline", () => { setNet("connecting"); if (!wasOff){ wasOff=true; toast("Sin internet. Reconectando…", 4000); } });
    c.on("connect", () => { setNet("ok"); if (wasOff){ wasOff=false; toast("Conectado de nuevo."); } for (const tp of this.subs) c.subscribe(tp, {qos:1}); });
    c.on("message", (topic, buf) => {
      const code = topic.split("/").pop();
      let data = null;
      if (buf.length) { try { data = JSON.parse(buf.toString()); } catch { return; } }
      const g = this.games[code] || (this.games[code] = {data:null, seen:false, fns:new Set()});
      if (data && g.data && (data.rev||0) < (g.data.rev||0)) return;
      g.data = data; g.seen = true;
      (this.waiters[code]||[]).forEach(f=>f()); delete this.waiters[code];
      g.fns.forEach(fn => fn());
    });
  },
  acks:{},
  sub(code){
    const tp = TOPIC(code);
    if (!this.subs.has(tp)){
      this.subs.add(tp);
      this.acks[tp] = new Promise(r => this.client.subscribe(tp, {qos:1}, () => r()));
    }
    return this.games[code] || (this.games[code] = {data:null, seen:false, fns:new Set()});
  },
  publish(code, data){
    const g = this.sub(code); g.data = data; g.seen = true;
    g.fns.forEach(fn => fn());
    return new Promise((res, rej) => this.client.publish(TOPIC(code), JSON.stringify(data), {qos:1, retain:true}, e => e ? rej({code:"unavailable"}) : res()));
  },
};
const snapOf = d => ({exists:!!d, data:()=>d});
function gameRef(code){
  return {
    get(){
      const g = Net.sub(code);
      if (g.seen) return Promise.resolve(snapOf(g.data));
      // Un tema sin mensaje retenido no responde: si poco después de suscribirse no llegó nada, la partida no existe.
      return new Promise(res => {
        let over = false;
        const fin = () => { if (over) return; over = true; res(snapOf(Net.games[code].data)); };
        (Net.waiters[code] ||= []).push(fin);
        Net.acks[TOPIC(code)].then(() => setTimeout(fin, 900));
        setTimeout(fin, 6000);
      });
    },
    set(data){ return Net.publish(code, {...data, rev:((Net.games[code]?.data?.rev)||0)+1}); },
    update(patch){
      const cur = Net.games[code]?.data;
      if (!cur) return Promise.reject({code:"invalid_argument"});
      return Net.publish(code, {...merge(cur, patch), rev:(cur.rev||0)+1});
    },
    onSnapshot(next){
      const g = Net.sub(code), fn = () => next(snapOf(g.data));
      g.fns.add(fn); if (g.seen) setTimeout(fn, 0);
      return () => g.fns.delete(fn);
    },
  };
}
function localRef(path){
  const k = "doc:" + path;
  return { get: async () => snapOf(LS.get(k)), set: async d => LS.set(k, d) };
}
// Partidas contra la IA y de "pasar el celular": viven solo en este teléfono, sin internet.
const Local = {};
function localGameRef(path){
  const k = "doc:" + path;
  const st = Local[path] || (Local[path] = {data:LS.get(k), fns:new Set()});
  const pub = d => { st.data = d; LS.set(k, d); setTimeout(() => st.fns.forEach(f=>f()), 0); return Promise.resolve(); };
  return {
    get: async () => snapOf(st.data),
    set: d => pub({...d, rev:(st.data?.rev||0)+1}),
    update: p => st.data ? pub({...merge(st.data, p), rev:(st.data.rev||0)+1}) : Promise.reject({code:"invalid_argument"}),
    onSnapshot(next){ const fn = () => next(snapOf(st.data)); st.fns.add(fn); if (st.data) setTimeout(fn, 0); return () => st.fns.delete(fn); },
  };
}
const isLocal = code => /^(IA|LP)/.test(code||"");
const NetDB = { doc: p => /^games\/(IA|LP)/.test(p) ? localGameRef(p) : p.startsWith("games/") ? gameRef(p.slice(6)) : localRef(p) };

/* ===== Estado ===== */
const S = {
  db:null, uid:null, status:"loading", net:"", netOk:false,
  nick: LS.get("nick") || "", level: LS.get("level") || "medio",
  nOnline: 3, nAI: 4, nLocal: 3, names: LS.get("names") || ["","","","","",""],
  code:null, game:null, unsub:null, activeSeat:null, joinCode:"", joinErr:"",
  sel:null, tool:"attack", pick:[], step:1,
};
const ref = () => S.db.doc("games/"+S.code);
const seat = () => { const g=S.game; if (!g) return null; if (g.mode==="local") return S.activeSeat; const i=(g.seats||[]).findIndex(p=>p && !p.bot && p.uid===S.uid); return i<0 ? null : i; };
const nickOf = i => S.game?.seats?.[i]?.nick || E.COLORS[i]?.name || `Jugador ${i+1}`;
const isHost = () => S.game && (S.game.mode!=="online" || S.game.host===S.uid);

async function save(g){
  try { await ref().set(g); return true; }
  catch { await new Promise(r=>setTimeout(r,500)); try { await ref().set(g); return true; } catch { toast("Se cortó la conexión. Probá de nuevo."); return false; } }
}
function act(fn){
  const g=S.game, me=seat();
  try { const g2 = fn(g, me); save(g2); return g2; }
  catch(e){ toast(e.message || "Esa jugada no se puede hacer."); return null; }
}

/* ===== Conexión ===== */
function setNet(state){
  S.net = state; S.netOk = state==="ok";
  const el = $("#netst"); if (!el) return;
  el.className = "netst " + state;
  el.innerHTML = state==="ok" ? "● Conectado al servidor de partidas"
    : state==="connecting" ? "● Conectando al servidor de partidas…"
    : `● Sin conexión al servidor de partidas <button type="button" class="linkbtn" id="netretry">Reintentar</button>`;
  const r = $("#netretry"); if (r) r.onclick = () => ensureNet();
}
async function ensureNet(){
  if (Net.client?.connected){ setNet("ok"); return true; }
  setNet("connecting");
  try { await Net.connect(); setNet("ok"); return true; }
  catch { setNet("fail"); toast("No hay conexión con el servidor de partidas. Revisá tu internet o jugá contra la IA.", 5000); return false; }
}
async function busy(btnId, label, fn){
  const b = $("#"+btnId); if (!b || b.disabled) return;
  const old = b.textContent; b.disabled = true; b.textContent = label;
  try { await fn(); } finally { if (b.isConnected){ b.disabled = false; b.textContent = old; } }
}

/* ===== Partidas ===== */
function genCode(){ const L="BCDFGHJKLMNPRSTVXZ"; let c=""; for(let i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }
function saveNick(){
  const v = ($("#nick")?.value ?? S.nick).trim().slice(0,16);
  if (!v){ toast("Escribí tu nombre."); $("#nick")?.focus(); return false; }
  S.nick = v; LS.set("nick", v); return true;
}
const base = extra => ({ created:Date.now(), level:S.level, phase:"lobby", ...extra });
async function createOnline(){
  if (!saveNick() || !await ensureNet()) return;
  let code;
  for (let i=0;i<3;i++){ code=genCode(); const s=await S.db.doc("games/"+code).get().catch(()=>null); if (s && !s.exists) break; }
  S.code = code;
  const seats = Array(S.nOnline).fill(null); seats[0] = {uid:S.uid, nick:S.nick};
  if (!await save(base({code, mode:"online", n:S.nOnline, seats, host:S.uid}))){ S.code=null; return; }
  await enter(code);
}
// Volver a una partida online: el que entra con el mismo nombre (o elige quién es) recupera su lugar,
// aunque el navegador ya no lo reconozca (memoria borrada, o el ícono del inicio en vez de Safari).
const sameNick = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
async function reclaimSeat(g, i){
  const old=g.seats[i].uid, seats=g.seats.slice(); seats[i]={...seats[i], uid:S.uid};
  const g2={...g, seats}; if (g.host===old) g2.host=S.uid;
  S.rejoin=null;
  if (!await save(g2)){ S.code=null; return; }
  toast(`Volviste a la partida como ${seats[i].nick}.`);
  await enter(g.code||S.code);
}
async function pickRejoin(i){
  const code=S.rejoin?.code; if (!code) return;
  S.code=code; const snap=await S.db.doc("games/"+code).get().catch(()=>null);
  if (!snap?.exists){ S.rejoin=null; S.code=null; S.joinErr="Esa partida ya no existe."; render(true); return; }
  await reclaimSeat(snap.data(), i);
}
function rejoinHTML(){
  const last=LS.get("last");
  if (S.rejoin) return `<section class="panel" style="box-shadow:inset 0 0 0 2px var(--gold,#e6b94f)"><span class="label">Partida ${esc(S.rejoin.code)} en curso</span>
    <p>¿Quién sos? Tocá tu nombre para volver a tu lugar.</p>
    <div class="row">${S.rejoin.list.map(([i,n])=>`<button class="btn" type="button" data-rj="${i}">Soy ${esc(n)}</button>`).join("")}</div>
    <button class="btn ghost small" type="button" id="rjx">Cancelar</button></section>`;
  if (last && !S.code) return `<section class="panel"><span class="label">Tu última partida online</span>
    <div class="ask"><div class="code" style="font-size:2rem;padding:4px 0;border:0;flex:1;text-align:left">${esc(last)}</div><button class="btn" type="button" id="rjlast">Volver a unirme</button></div>
    <button class="linkbtn" type="button" id="rjforget" style="align-self:flex-start;font-size:.85rem">Olvidar esta partida</button></section>`;
  return "";
}
async function joinGame(raw){
  if (!saveNick()) return;
  const code = (raw||"").toUpperCase().replace(/[^A-Z]/g,""); S.joinCode = code;
  if (code.length!==4){ S.joinErr="El código tiene 4 letras."; render(true); return; }
  if (!await ensureNet()) return;
  const snap = await S.db.doc("games/"+code).get().catch(()=>null);
  if (!snap || !snap.exists){ S.joinErr="No existe una partida con ese código."; render(true); return; }
  const g = snap.data(); S.code = code;
  if (g.seats.some(p=>p && p.uid===S.uid && !p.bot)){ await enter(code); return; }
  const mine = g.phase==="lobby" ? -1 : g.seats.findIndex(p=>p && !p.bot && sameNick(p.nick, S.nick));
  if (mine>=0){ await reclaimSeat(g, mine); return; }
  const free = g.seats.findIndex(p=>!p);
  if (g.phase!=="lobby" && g.phase){
    // Ya empezó: si no coincide el nombre, que elija quién es.
    const list = g.seats.map((p,i)=>p && !p.bot ? [i,p.nick] : null).filter(Boolean);
    S.code=null; S.rejoin={code, list}; S.joinErr=""; render(true); return;
  }
  if (free<0){ S.code=null; S.joinErr="Esa partida ya está completa."; render(true); return; }
  const seats = g.seats.slice(); seats[free] = {uid:S.uid, nick:S.nick};
  if (!await save({...g, seats})){ S.code=null; return; }
  await enter(code);
}
async function createAI(){
  if (!saveNick()) return;
  const code = "IA" + genCode() + Date.now().toString(36).slice(-3).toUpperCase(), n=S.nAI;
  const seats = Array.from({length:n}, (_,i) => i===0 ? {uid:S.uid, nick:S.nick} : {bot:true, nick:`IA ${E.COLORS[i].name}`});
  S.code = code;
  await NetDB.doc("games/"+code).set(E.setup(base({code, mode:"ai", n, seats})));
  await enter(code);
}
async function createLocal(){
  const n=S.nLocal, names=[];
  for (let i=0;i<n;i++){ const v=($("#lp"+i).value||"").trim().slice(0,16); if (!v){ toast(`Escribí el nombre del jugador ${i+1}.`); $("#lp"+i).focus(); return; } names.push(v); }
  if (new Set(names.map(x=>x.toLowerCase())).size!==n){ toast("Usen nombres distintos para no confundirse."); return; }
  S.names = names.concat(S.names.slice(n)); LS.set("names", S.names);
  const code = "LP" + genCode() + Date.now().toString(36).slice(-3).toUpperCase();
  S.code = code; S.activeSeat = null;
  await NetDB.doc("games/"+code).set(E.setup(base({code, mode:"local", n, seats:names.map(nick=>({uid:S.uid, nick}))})));
  await enter(code);
  S.activeSeat = 0;
}
async function enter(code){
  if (!isLocal(code)) LS.set("last", code);
  S.code = code; LS.set("code", code); S.joinErr=""; S.sel=null; S.pick=[]; MAP.fitted=false;
  startChat(code);
  if (S.unsub) S.unsub();
  S.unsub = ref().onSnapshot(snap => {
    if (!snap.exists){ toast("La partida ya no existe."); leave(); return; }
    S.game = snap.data(); onGame();
  });
}
function leave(){
  stopChat(); clearTimeout(botT);
  if (S.unsub) S.unsub(); S.unsub=null; S.game=null; S.code=null; S.activeSeat=null; LS.set("code", null); render(true);
}

/* ===== Reacciones ===== */
let botT, lastBuzz="", lastTurnKey="";
function onGame(){
  const g=S.game, me=seat();
  if (g.mode==="local" && g.phase!=="play" && S.activeSeat==null) S.activeSeat=0;
  const tk = g.phase==="play" ? `${g.round}:${g.kind}:${g.si}` : "";
  if (tk!==lastTurnKey){ lastTurnKey=tk; S.sel=null; S.tgt=null; S.pick=[]; S.tool="attack"; }
  if (g.regroup) S.tool="regroup";
  if (S.sel && g.owner?.[S.sel]!==me) S.sel=null;
  if (S.tgt && (!S.sel || g.owner?.[S.tgt]===me || !E.ADJ[S.sel].includes(S.tgt) || g.armies[S.sel]<2)) S.tgt=null;
  if (g.phase==="play" && me!=null && g.mode==="online" && g.turn===me){
    const k = tk; if (k!==lastBuzz){ lastBuzz=k; buzz([60]); }
  }
  runBots(); render();
}
// Las IA juegan en el teléfono del anfitrión (o en el único teléfono, en los modos sin internet).
function runBots(){
  clearTimeout(botT);
  const g=S.game;
  if (!g || g.phase!=="play" || !isHost() || !g.seats[g.turn]?.bot) return;
  // Si en una partida contra la IA ya no queda nadie de carne y hueso, las IA terminan rápido.
  const humans = g.seats.some((p,i)=>!p.bot && !g.out[i]);
  const rev=g.rev, d = !humans ? 120 : g.stage==="place" ? 900 : g.pendingMove ? 700 : 1500;
  botT = setTimeout(() => {
    const cur=S.game; if (!cur || cur.rev!==rev) return;
    const s=cur.turn, lv=cur.seats[cur.turn]?.level || cur.level || "medio";
    try { save(E.botStep(cur, s, lv)); }
    catch(e){
      console.error(e);
      try {
        let h=cur;
        if (h.stage==="attack"){ if (h.pendingMove) h=E.moveIn(h,s,1); save(E.endAttack(h,s)); }
        else save(E.botStep(cur, s, "facil"));
      } catch(e2){ console.error(e2); }
    }
  }, d + Math.random()*250);
}
// En el modo de un solo celular, el que tiene que tener el teléfono es el del turno.
const actorOf = g => g.phase!=="play" ? null : g.turn;

/* ===== Jugadas ===== */
function onCountry(id){
  const g=S.game, me=seat();
  if (!g || g.phase!=="play") return;
  const c=E.BYID[id], own=g.owner[id];
  if (g.turn!==me){ toast(`${c.name}: ${nickOf(own)}, ${g.armies[id]} ${g.armies[id]===1?"ejército":"ejércitos"}.`, 2200); return; }
  if (g.stage==="place"){
    const left=E.poolLeft(g.pool);
    act((h,m)=>E.place(h,m,id,S.step==="all"?left:S.step));
    return;
  }
  if (g.pendingMove){ toast("Primero elegí cuántos ejércitos pasan al país conquistado."); return; }
  if (S.tool==="regroup"){
    if (own===me && S.sel && S.sel!==id && E.ADJ[S.sel].includes(id)){ act((h,m)=>E.regroup(h,m,S.sel,id,1)); return; }
    if (own!==me){ toast("Para reagrupar, tocá países tuyos."); return; }
    S.sel = S.sel===id ? null : id; render(true); return;
  }
  if (own===me){
    if (S.sel===id){ S.sel=null; render(true); return; }
    if (g.armies[id]<2){ toast("Para atacar necesitás al menos 2 ejércitos en ese país."); }
    S.sel=id; render(true); return;
  }
  if (!S.sel){ toast("Primero tocá uno de tus países para atacar desde ahí."); return; }
  if (!E.ADJ[S.sel].includes(id)){ toast(`${c.name} no limita con ${NAME(S.sel)}.`); return; }
  if (g.armies[S.sel]<2){ toast("Para atacar necesitás al menos 2 ejércitos en ese país."); return; }
  S.tgt = id; render(true);
}
// Tirar los dados: primero ruedan un momento y después se juega el ataque de verdad.
let rollT;
function doRoll(){
  const g=S.game, from=S.sel, to=S.tgt;
  if (S.rolling || !from || !to) return;
  S.rolling = true; render(true); buzz([25]);
  const faces = () => document.querySelectorAll(".dice.rolling .d").forEach(d => { d.classList.remove("q"); d.innerHTML = pips(1+Math.floor(Math.random()*6)); });
  clearInterval(rollT); rollT = setInterval(faces, 75);
  setTimeout(() => {
    clearInterval(rollT); S.rolling = false;
    const g2 = act((h,m)=>E.attack(h,m,from,to));
    if (!g2){ render(true); return; }
    S.ownRoll = g2.lastRoll.n;
    buzz(g2.lastRoll.ld ? [40,30,40] : [70]);
    if (g2.owner[to]===seat()) S.tgt = null;          // conquistado: ahora toca pasar ejércitos
    else if (g2.armies[from]<2) S.tgt = null;          // ya no se puede seguir atacando desde ahí
  }, 700);
}
function doMoveIn(k){ const to=S.game.pendingMove?.to; const g2=act((h,m)=>E.moveIn(h,m,k)); if (g2 && to && g2.armies[to]>=2) S.sel=to; S.tgt=null; }
function doEnd(){
  const g=S.game;
  if (g.stage==="place") act((h,m)=>E.finishPlace(h,m));
  else act((h,m)=>E.endAttack(h,m));
}
function doTrade(){
  const g2 = act((h,m)=>E.trade(h,m,S.pick)); if (g2) S.pick=[];
}
function startGame(){ const g=S.game; if (g.seats.some(p=>!p)){ toast("Faltan jugadores. Esperá a que se unan o agregá una IA."); return; } save(E.setup(E.clone({...g, level:S.level}))); }
// Nivel de cada IA de la sala: el anfitrión lo elige al lado de su nombre y todos lo ven.
const LVNAME = {facil:"Fácil", medio:"Medio", dificil:"Difícil"};
const botLevelHTML = (p, i, host) => !p?.bot ? "" : host
  ? `<span class="blv" role="group" aria-label="Nivel de ${esc(p.nick)}">${Object.entries(LVNAME).map(([v,t])=>`<button type="button" data-blv="${i}:${v}" aria-pressed="${(p.level||"medio")===v}">${t}</button>`).join("")}</span><button type="button" class="linkbtn" data-unbot="${i}" aria-label="Quitar ${esc(p.nick)}">✕</button>`
  : `<span class="muted">${LVNAME[p.level||"medio"]}</span>`;
function setBotLevel(i, lv){ const g=S.game, seats=g.seats.slice(); seats[i]={...seats[i], level:lv}; S.level=lv; LS.set("level",lv); save({...g, seats}); }
function removeBot(i){ const g=S.game, seats=g.seats.slice(); seats[i]=null; save({...g, seats}); }
function addBot(i){ const g=S.game, seats=g.seats.slice(); seats[i]={bot:true, nick:`IA ${E.COLORS[i].name}`, level:S.level}; save({...g, seats, level:S.level}); }
function rematch(){ MAP.fitted=false; save(E.setup(E.clone(S.game))); S.activeSeat = S.game.mode==="local" ? null : S.activeSeat; }
function takePhone(){ S.activeSeat = actorOf(S.game); S.sel=null; S.pick=[]; render(true); scrollTo(0,0); }

/* ===== Mapa =====
   Un SVG de 1000×600 que se mueve con un dedo y se agranda pellizcando o con los botones.
   El elemento vive aparte de la pantalla, así un cambio de estado no corta el gesto. */
const W=TegMap.W, H=TegMap.H, NS="http://www.w3.org/2000/svg";
const MAP = {el:null, svg:null, dyn:null, vb:{x:0,y:0,w:W,h:H}, ptr:new Map(), g0:null, fitted:false};
const M = TegMap, POS = M.pos;
// El tablero completo está pintado en board.jpg (con mares, rutas y adornos); encima van las fichas.
function staticSVG(){
  return `<defs>${E.COUNTRIES.map(c=>`<clipPath id="cp-${c.id}"><path d="${M.paths[c.id]}"/></clipPath>`).join("")}</defs>
    <rect x="-600" y="-600" width="${W+1200}" height="${H+1200}" fill="#3b2614"/>
    <image href="board.jpg" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>`;
}
function mapEl(){
  if (MAP.el) return MAP.el;
  const wrap = document.createElement("div"); wrap.className="mapwrap";
  wrap.innerHTML = `<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa del mundo">${staticSVG()}<g id="dyn"></g><g id="arrow" pointer-events="none"></g></svg>

    <span class="hint">Arrastrá para mover · pellizcá para zoom</span>`;
  MAP.el=wrap; MAP.svg=wrap.querySelector("svg"); MAP.dyn=wrap.querySelector("#dyn"); MAP.arrow=wrap.querySelector("#arrow");

  });
  const svg=MAP.svg;
  const toMap = (cx,cy) => { const r=svg.getBoundingClientRect(), s=Math.max(MAP.vb.w/r.width, MAP.vb.h/r.height); return {x:MAP.vb.x+(cx-r.left-(r.width-MAP.vb.w/s)/2)*s, y:MAP.vb.y+(cy-r.top-(r.height-MAP.vb.h/s)/2)*s, s}; };

    } else if (pts.length>=2 && g0.pts.length>=2){
      const d0=Math.hypot(g0.pts[0].x-g0.pts[1].x, g0.pts[0].y-g0.pts[1].y)||1, d1=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)||1;
      const m0={x:(g0.pts[0].x+g0.pts[1].x)/2, y:(g0.pts[0].y+g0.pts[1].y)/2}, m1={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
      const k = clampW(g0.vb.w*d0/d1)/g0.vb.w;
      // El punto del mapa que estaba bajo el centro de los dedos queda bajo el nuevo centro.
      const ox=(r.width-g0.vb.w/s)/2, oy=(r.height-g0.vb.h/s)/2;

  };

  addEventListener("resize", ()=>{ if (MAP.el.isConnected) setVB(MAP.vb); });

const clampW = w => Math.max(110, Math.min(W*1.1, w));
function aspect(){ const r=MAP.svg.getBoundingClientRect(); return r.width>0 ? r.height/r.width : H/W; }
function setVB(v){
  const ar=aspect(); let w=clampW(v.w), h=w*ar;
  let cx=v.x+v.w/2, cy=v.y+(v.h||v.w*ar)/2;
  cx=Math.max(Math.min(w/2,W/2)-20, Math.min(W-Math.min(w/2,W/2)+20, cx));
  cy=Math.max(Math.min(h/2,H/2)-20, Math.min(H-Math.min(h/2,H/2)+20, cy));
  MAP.vb={x:cx-w/2, y:cy-h/2, w, h};
  MAP.svg.setAttribute("viewBox", `${MAP.vb.x.toFixed(1)} ${MAP.vb.y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
}
function zoomAt(k, px, py){ const v=MAP.vb, w=clampW(v.w*k), kk=w/v.w; setVB({x:px-(px-v.x)*kk, y:py-(py-v.y)*kk, w, h:v.h*kk}); }
function fitAll(){ const ar=aspect(); const w = ar>H/W ? W : H/ar; setVB({x:(W-w)/2, y:(H-w*ar)/2, w}); }
// Primera vista: en un celular parado se ve todo el alto del mapa y se arrastra a los costados.
function fitStart(){
  const ar=aspect();
  if (ar<=H/W){ fitAll(); return; }
  const w=Math.max(300, H/ar), g=S.game, me=seat();
  let cx=W/2;
  if (g?.owner && me!=null){ const mine=E.owned(g,me).map(id=>POS[id][0]); if (mine.length) cx=mine.reduce((a,b)=>a+b,0)/mine.length; }
  setVB({x:cx-w/2, y:H/2-w*ar/2, w});
}
function paintMap(){
  const g=S.game, me=seat(), myTurn=g.phase==="play" && g.turn===me;
  const cls = {};
  if (myTurn && g.stage==="place"){
    const c=Object.entries(g.pool?.cont||{}).find(([,v])=>v>0)?.[0];
    if (E.poolLeft(g.pool)>0) E.owned(g,me).forEach(id=>{ if (!c || g.pool.free>0 || E.BYID[id].c===c) cls[id]="can"; });
  }
  if (myTurn && g.stage==="attack" && !g.pendingMove){
    if (S.sel){
      cls[S.sel]="sel";
      for (const n of E.ADJ[S.sel]){
        if (S.tool==="regroup"){ if (g.owner[n]===me) cls[n]="mov"; }
        else if (g.owner[n]!==me && g.armies[S.sel]>=2) cls[n]= n===S.tgt ? "aim" : "tgt";
      }
    }
  }
  if (myTurn && g.pendingMove){ cls[g.pendingMove.from]="sel"; cls[g.pendingMove.to]="mov"; }
  let h="";
  for (const c of E.COUNTRIES){
    const o=g.owner?.[c.id], a=g.armies?.[c.id]??0, [x,y]=POS[c.id], d=M.paths[c.id];
    const col = o!=null ? colorOf(o) : "#777";
    h += `<g class="ct ${cls[c.id]||""}" data-c="${c.id}">
      <path class="hl" d="${d}" style="--oc:${col}"/>
      <path d="${d}" clip-path="url(#cp-${c.id})" fill="none" stroke="${col}" stroke-width="2.8" stroke-linejoin="round"/>
      <path class="ring" d="${d}"/>
      <circle cx="${x}" cy="${y}" r="7.6" fill="${col}" stroke="rgba(0,0,0,.7)" stroke-width="1.1"/>
      <text class="ar" x="${x}" y="${y+.5}" fill="${o!=null?inkOf(o):"#fff"}">${a}</text>
      <text class="nm" x="${x}" y="${y+14.5}">${esc(c.name)}</text></g>`;
  }
  MAP.dyn.innerHTML=h;
  // Flecha del último ataque
  const r=g.lastRoll;
  if (r && g.phase==="play"){
    const A=POS[r.from], B=POS[r.to];
    const far = Math.abs(A[0]-B[0])>400;
    MAP.arrow.innerHTML = far ? "" : `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#ffcf5a" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 5" opacity=".95"/>`;
  } else MAP.arrow.innerHTML="";
}

const QUICK = ["¡Al ataque!", "¡Qué dados!", "¿Pacto de no agresión?", "Te voy a invadir", "Bien jugado", "¡Revancha!"];
const Chat = {code:null, msgs:[[],[],[],[],[],[]], unsubs:[], open:false};
const chatRef = i => NetDB.doc(`games/${Chat.code}-chat${i}`);
function startChat(code){
  if (Chat.code===code) return;
  stopChat();
  if (isLocal(code)) return;
  Chat.code=code; Chat.msgs=[[],[],[],[],[],[]];
  for (let i=0;i<6;i++) Chat.unsubs.push(chatRef(i).onSnapshot(snap => {
    const before=Chat.msgs[i].length; Chat.msgs[i]=snap.data()?.msgs||[];
    if (i!==seat() && Chat.msgs[i].length>before && before && !Chat.open) buzz([40]);
    updateChat();
  }));
}
function stopChat(){ Chat.unsubs.forEach(u=>u()); Chat.unsubs=[]; Chat.code=null; Chat.open=false; updateChat(); }
async function sendChat(text){
  const me=seat(); text=(text||"").trim().slice(0,200);
  if (!text || me==null || !Chat.code) return;
  try { await chatRef(me).set({msgs:[...Chat.msgs[me], {text, t:Date.now()}].slice(-40)}); } catch { toast("No se pudo mandar el mensaje."); }
}
function updateChat(){
  const g=S.game, me=seat(), btn=$("#chatbtn"), box=$("#chat");
  const on = !!(Chat.code && g && g.mode==="online" && me!=null);
  btn.hidden = !on || Chat.open; box.hidden = !on || !Chat.open;
  if (!on) return;
  const seenKey="chatseen:"+Chat.code, seen=LS.get(seenKey)||0;
  const all = Chat.msgs.flatMap((ms,i)=>ms.map(m=>({...m,by:i}))).sort((a,b)=>a.t-b.t);
  const unread = all.filter(m=>m.by!==me && m.t>seen).length, badge=$("#chatbadge");
  badge.hidden=!unread; badge.textContent = unread>9 ? "9+" : unread;
  if (!Chat.open) return;
  if (all.length) LS.set(seenKey, all[all.length-1].t);
  badge.hidden=true;
  const html = all.map(m=>`<li class="${m.by===me?"mine":""}">${m.by!==me?`<small>${esc(nickOf(m.by))}</small>`:""}<span>${esc(m.text)}</span></li>`).join("") || `<li class="none">Todavía no hay mensajes.</li>`;
  const log=$("#chatlog"); if (log.innerHTML!==html){ log.innerHTML=html; log.scrollTop=log.scrollHeight; }
}

// Safari no compensa el desplazamiento cuando cambia el contenido de arriba: el mapa queda donde estaba.
function keepInPlace(sel, fn){
  const a = document.querySelector(sel), top = a ? a.getBoundingClientRect().top : null;
  fn();
  const b = document.querySelector(sel);
  if (top!=null && b){ const d = b.getBoundingClientRect().top - top; if (Math.abs(d) > 0.5) window.scrollBy(0, d); }
}
let screen="";
function render(force){
  const app=$("#app"), g=S.game, me=seat();
  let sc;
  if (S.status!=="ready") sc="loading";
  else if (!S.code || !g) sc = S.code ? "loading" : "home";
  else if (g.phase==="lobby") sc = me==null ? "full" : "lobby";
  else if (g.mode==="local" && g.phase==="play" && S.activeSeat!==actorOf(g)) sc="handoff";
  else if (me==null) sc="full";
  else sc=g.phase;
  if (sc==="home" && screen==="home" && !force){ updateChat(); return; }
  const same = screen===sc; screen=sc; app.dataset.sc=sc;
  const paint = () => {
    app.innerHTML=(VIEWS[sc]||VIEWS.loading)();
    const slot=$("#mapslot");
    if (slot){ slot.appendChild(mapEl()); if (!MAP.fitted){ MAP.fitted=true; fitStart(); requestAnimationFrame(fitStart); } else setVB(MAP.vb); paintMap(); }
    bind(sc);
  };
  if (same && (sc==="play" || sc==="over")) keepInPlace("#mapslot", paint); else { paint(); scrollTo(0,0); }
  const lr=g?.lastRoll;
  if (lr?.n!=null && (lr.n===S.ownRoll || S.spinFor!==lr.n || Date.now()-S.spinAt>=SPIN_MS)) S.seenRoll = lr.n;
  updateChat();
}

    ${canTrade && mine.length>=3 ? `<div class="acts"><button class="btn" id="tradeb" type="button"${pick.length===3&&E.validSet(pick)?"":" disabled"}>Canjear 3 por ${E.tradeValue(g.trades[me])}</button></div>
      <p class="muted" style="font-size:.85rem">Elegí 3 tarjetas del mismo símbolo o de los tres distintos (el comodín sirve para cualquiera).</p>` : ""}
    ${usable.length ? `<div class="chips">${usable.map(id=>`<button type="button" class="chip" data-use="${id}">+2 en ${esc(NAME(id))}</button>`).join("")}</div>` : ""}
  </section>`;
}
function objHTML(){
  const g=S.game, me=seat();
  return `<section class="panel"><span class="label">${g.mode==="local"?esc(nickOf(me))+": tu":"Tu"} objetivo secreto</span><p class="obj">${esc(E.objText(g,me))}</p>
    <p class="muted" style="font-size:.85rem">También ganás si ocupás 30 países.</p></section>`;
}
function logHTML(){
  const g=S.game;
  const items=(g.log||[]).slice().reverse().slice(0,30).map(l=>`<li>${dotHTML(l.s)}<span><b>${esc(nickOf(l.s))}</b> ${esc(l.x)}</span></li>`).join("");
  return `<section class="panel log"><span class="label">Movimientos</span><ol>${items||`<li class="muted">Todavía no pasó nada.</li>`}</ol></section>`;
}

function bind(sc){
  const on = (sel, fn) => { const el=$(sel); if (el) el.onclick=fn; };
  on("#leave", leave);
  const segs = (key, fn) => document.querySelectorAll(`[data-${key}]`).forEach(b=>b.onclick=()=>{ document.querySelectorAll(`[data-${key}]`).forEach(x=>x.setAttribute("aria-pressed", x===b)); fn(b.dataset[key]); });
  if (sc==="home"){
    on("#rjlast", ()=>busy("rjlast","Volviendo…",()=>joinGame(LS.get("last"))));
    on("#rjforget", ()=>{ LS.set("last", null); render(true); });
    on("#rjx", ()=>{ S.rejoin=null; render(true); });
    document.querySelectorAll("[data-rj]").forEach(b=>b.onclick=()=>pickRejoin(+b.dataset.rj));
    on("#create", ()=>busy("create","Creando partida…",createOnline));
    const j=$("#join"); on("#joinb", ()=>busy("joinb","Buscando…",()=>joinGame(j.value)));
    j.onkeydown=e=>{ if (e.key==="Enter") busy("joinb","Buscando…",()=>joinGame(j.value)); };
    on("#aib", createAI); on("#lpb", createLocal);
    segs("non", v=>S.nOnline=+v); segs("nai", v=>S.nAI=+v); segs("lvl", v=>{ S.level=v; LS.set("level",v); });
    segs("nlp", v=>{ for (let i=0;i<S.nLocal;i++){ const el=$("#lp"+i); if (el) S.names[i]=el.value; } S.nLocal=+v; render(true); });
    setNet(S.net || "connecting");
  }
  if (sc==="lobby"){
    on("#copy", async()=>{ try { await navigator.clipboard.writeText(S.code); toast("Código copiado."); } catch { toast("Copiá el código a mano: "+S.code); } });
    document.querySelectorAll("[data-bot]").forEach(b=>b.onclick=()=>addBot(+b.dataset.bot));
    document.querySelectorAll("[data-blv]").forEach(b=>b.onclick=()=>{ const [i,lv]=b.dataset.blv.split(":"); setBotLevel(+i, lv); });
    document.querySelectorAll("[data-unbot]").forEach(b=>b.onclick=()=>removeBot(+b.dataset.unbot));
    on("#start", startGame);
  }
  if (sc==="handoff") on("#take", takePhone);
  if (sc==="play"){
    on("#rollb", doRoll); on("#endb", doEnd); on("#undob", ()=>act((h,m)=>E.unplace(h,m))); on("#tradeb", doTrade);
    segs("stp", v=>{ S.step = v==="all" ? "all" : +v; });
    segs("tool", v=>{ S.tool=v; S.sel=null; render(true); });
    document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>doMoveIn(+b.dataset.mv));
    document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>act((h,m)=>E.useCard(h,m,b.dataset.use)));
    document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.card, g=S.game;
      if (!(g.turn===seat() && g.stage==="place" && g.kind==="normal")) return;
      S.pick = S.pick.includes(id) ? S.pick.filter(x=>x!==id) : [...S.pick, id].slice(-3); render(true);
    });
  }
  if (sc==="over") on("#again", rematch);
}

async function boot(){
  let uid = LS.get("uid"); if (!uid){ uid="u"+rid()+rid(); LS.set("uid",uid); }
  S.db = NetDB; S.uid = uid;
  const code = LS.get("code");
  if (isLocal(code)){
    S.status="ready";
    const g=(await S.db.doc("games/"+code).get()).data();
    if (g){ await enter(code); Net.connect().then(()=>setNet("ok")).catch(()=>setNet("fail")); return; }
    LS.set("code", null);
  }
  S.status="ready"; render(true);
  setNet("connecting");
  try { await Net.connect(); setNet("ok"); } catch { setNet("fail"); }
  if (code && !isLocal(code) && S.netOk && !S.code){
    const snap=await S.db.doc("games/"+code).get().catch(()=>null), g=snap?.exists?snap.data():null;
    if (g && g.seats.some(p=>p && !p.bot && p.uid===uid)){ await enter(code); return; }
    LS.set("code", null);
  }
}
